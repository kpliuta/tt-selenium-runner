[general]
id = "selenium_runner"
name = "Selenium Runner"
description = "Manages a proot-distro Ubuntu container with VNC to execute Selenium-based tasks"
url = "https://github.com/kpliuta/tt-selenium-runner"
version = "0.1.3"
app_min_version = ">=0.1.0"

[[property]]
name = "upgrade_on_startup"
description = "Run apt-get upgrade during container initialization"
input-type = "radio"
optional = false
options = ["true", "false"]
default = "false"

[[property]]
name = "terminate_existing_vnc"
description = "Terminate any running VNC server before starting a new one"
input-type = "radio"
optional = false
options = ["true", "false"]
default = "false"

[[task-validator]]
command = "test -f {task_path}/pyproject.toml"
description = "Task must be a valid Poetry project"

[[task-validator]]
command = "test -f {task_path}/src/main.py"
description = "Task must have a src/main.py entry point"

[[task-validator]]
command = "python src/validators/selenium.py {task_path}"
description = "Task must have selenium as a Poetry dependency"

[[task-validator]]
command = "python src/validators/webdriver_manager.py {task_path}"
description = "Task must have webdriver-manager as a Poetry dependency"

[exec]
initialization = "poetry install && poetry run python -m src.initialization"
before-exec = "poetry run python -m src.before_exec {runner_path}"
before-task = "poetry run python -m src.before_task {runner_path} {task_dir_name}"
task-exec = "poetry run python -m src.task_exec {runner_path} {task_dir_name}"
after-exec = "poetry run python -m src.after_exec {runner_path}"
termination = "poetry run python -m src.termination"
